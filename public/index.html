<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국어 시험지 OCR 변환기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
    header { background: #2c3e50; color: white; padding: 16px 40px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 600; }
    header .badge { margin-left: auto; background: rgba(255,255,255,0.15); font-size: 12px; padding: 4px 10px; border-radius: 20px; color: #a8d8ea; }
    .key-bar { background: #1a252f; padding: 10px 40px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .key-label { font-size: 13px; color: #ccc; white-space: nowrap; }
    .key-wrap { display: flex; align-items: center; flex: 1; min-width: 220px; max-width: 500px; background: #2c3e50; border: 1px solid #3d5166; border-radius: 6px; overflow: hidden; }
    .key-wrap:focus-within { border-color: #3498db; }
    #api-key-input { flex: 1; background: transparent; border: none; outline: none; padding: 7px 12px; font-size: 13px; color: #eee; font-family: monospace; }
    #api-key-input::placeholder { color: #6a7e90; }
    .key-toggle { background: transparent; border: none; padding: 7px 10px; cursor: pointer; color: #888; font-size: 14px; }
    .key-toggle:hover { color: #ccc; }
    #key-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    #key-status.set { background: #1e6b3c; color: #6fcf97; }
    #key-status.unset { background: #5c2c2c; color: #eb5757; }
    .key-link { font-size: 12px; color: #5dade2; text-decoration: none; white-space: nowrap; }
    .key-link:hover { text-decoration: underline; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .key-bar, header { padding-left: 20px; padding-right: 20px; } }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 16px; font-weight: 600; color: #555; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #f0f2f5; }
    #drop-zone { border: 2px dashed #c0c8d0; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafbfc; }
    #drop-zone:hover, #drop-zone.drag-over { border-color: #3498db; background: #ebf5fb; }
    #drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
    #drop-zone p { color: #666; font-size: 14px; margin-bottom: 8px; }
    #drop-zone strong { color: #3498db; }
    #file-input { display: none; }
    #selected-file { margin-top: 12px; padding: 10px 14px; background: #eaf4fd; border-radius: 8px; font-size: 13px; color: #2980b9; display: none; }
    .options { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .opt-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .opt-row label { color: #555; min-width: 80px; }
    select, input[type="number"] { border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px; font-size: 14px; color: #333; }
    select:focus, input[type="number"]:focus { outline: none; border-color: #3498db; }
    input[type="number"] { width: 70px; }
    #start-btn { width: 100%; margin-top: 20px; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    #start-btn:hover:not(:disabled) { background: #27ae60; }
    #start-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    #key-notice { margin-top: 10px; font-size: 12px; color: #e67e22; text-align: center; display: none; }
    #progress-section { display: none; margin-top: 20px; }
    .prog-wrap { background: #ecf0f1; border-radius: 100px; height: 10px; overflow: hidden; margin: 10px 0; }
    #progress-bar { height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); border-radius: 100px; width: 0%; transition: width 0.3s; }
    #progress-text { font-size: 13px; color: #666; text-align: center; }
    #page-log { max-height: 140px; overflow-y: auto; margin-top: 10px; font-size: 12px; color: #888; line-height: 1.8; }
    .log-line.done { color: #27ae60; }
    .log-line.active { color: #3498db; font-weight: bold; }
    .log-line.error { color: #e74c3c; }
    #preview-section { margin-top: 20px; display: none; }
    #preview-section h3 { font-size: 14px; color: #777; margin-bottom: 10px; }
    #canvas-container { display: flex; flex-wrap: wrap; gap: 10px; max-height: 300px; overflow-y: auto; }
    #canvas-container canvas { border: 1px solid #ddd; border-radius: 4px; max-width: 100%; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid #f0f2f5; }
    .result-header h2 { border: none; padding: 0; margin: 0; }
    .btn-group { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-copy { background: #3498db; color: white; }
    .btn-copy:hover { background: #2980b9; }
    .btn-dl { background: #9b59b6; color: white; }
    .btn-dl:hover { background: #8e44ad; }
    .btn-clr { background: #e74c3c; color: white; }
    .btn-clr:hover { background: #c0392b; }
    #output-text { width: 100%; height: 500px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; font-size: 14px; line-height: 1.8; resize: vertical; font-family: 'Malgun Gothic', monospace; color: #333; background: #fafbfc; }
    #output-text:focus { outline: none; border-color: #3498db; }
    #char-count { margin-top: 8px; font-size: 12px; color: #999; text-align: right; }
    #empty-state { text-align: center; padding: 60px 20px; color: #bbb; }
    #empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    #empty-state p { font-size: 14px; }
    .toast { position: fixed; bottom: 30px; right: 30px; background: #2c3e50; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 1000; max-width: 320px; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #27ae60; }
    .toast.error { background: #e74c3c; }
  </style>
</head>
<body>

<header>
  <span>&#128221;</span>
  <h1>국어 시험지 OCR 변환기</h1>
  <span class="badge">claude-opus-4-8</span>
</header>

<div class="key-bar">
  <span class="key-label">&#128273; API Key</span>
  <div class="key-wrap">
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    <button class="key-toggle" onclick="app.toggleKey()">&#128065;</button>
  </div>
  <span id="key-status" class="unset">미설정</span>
  <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener" class="key-link">키 발급 &#8594;</a>
</div>

<div class="container">
  <div class="card">
    <h2>PDF 파일 업로드</h2>
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">&#128196;</div>
      <p><strong>클릭하여 파일 선택</strong> 또는 여기에 파일을 끌어다 놓으세요</p>
      <p>지원 형식: PDF</p>
    </div>
    <input type="file" id="file-input" accept=".pdf">
    <div id="selected-file">&#128206; <span id="file-name"></span></div>
    <div class="options">
      <div class="opt-row">
        <label>렌더링 배율</label>
        <select id="scale-select">
          <option value="2">2x (권장)</option>
          <option value="1.5">1.5x (빠름)</option>
          <option value="3">3x (고화질)</option>
        </select>
      </div>
      <div class="opt-row">
        <label>페이지 범위</label>
        <input type="number" id="page-from" min="1" value="1" placeholder="시작">
        <span style="color:#aaa">~</span>
        <input type="number" id="page-to" min="1" value="" placeholder="끝 (전체)">
      </div>
    </div>
    <button id="start-btn" disabled>OCR 변환 시작</button>
    <div id="key-notice">상단에서 Anthropic API Key를 먼저 입력하세요.</div>
    <div id="progress-section">
      <div class="prog-wrap"><div id="progress-bar"></div></div>
      <div id="progress-text">준비 중...</div>
      <div id="page-log"></div>
    </div>
    <div id="preview-section">
      <h3>페이지 미리보기</h3>
      <div id="canvas-container"></div>
    </div>
  </div>

  <div class="card">
    <div class="result-header">
      <h2>인식된 텍스트</h2>
      <div class="btn-group">
        <button class="btn-sm btn-copy" onclick="app.copy()">복사</button>
        <button class="btn-sm btn-dl" onclick="app.download()">HTML 저장</button>
        <button class="btn-sm btn-clr" onclick="app.clear()">지우기</button>
      </div>
    </div>
    <div id="empty-state">
      <div class="icon">&#128269;</div>
      <p>PDF를 업로드하고 OCR 변환을 시작하면<br>인식된 텍스트가 여기에 표시됩니다.</p>
    </div>
    <textarea id="output-text" style="display:none"></textarea>
    <div id="char-count" style="display:none"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var app = (function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var sel = {
    keyInput:   function () { return document.getElementById("api-key-input"); },
    keyStatus:  function () { return document.getElementById("key-status"); },
    startBtn:   function () { return document.getElementById("start-btn"); },
    keyNotice:  function () { return document.getElementById("key-notice"); },
    fileName:   function () { return document.getElementById("file-name"); },
    selFile:    function () { return document.getElementById("selected-file"); },
    pageTo:     function () { return document.getElementById("page-to"); },
    progSec:    function () { return document.getElementById("progress-section"); },
    prevSec:    function () { return document.getElementById("preview-section"); },
    canvasCon:  function () { return document.getElementById("canvas-container"); },
    pageLog:    function () { return document.getElementById("page-log"); },
    emptyState: function () { return document.getElementById("empty-state"); },
    outputText: function () { return document.getElementById("output-text"); },
    charCount:  function () { return document.getElementById("char-count"); },
    progBar:    function () { return document.getElementById("progress-bar"); },
    progText:   function () { return document.getElementById("progress-text"); },
    toast:      function () { return document.getElementById("toast"); }
  };

  var selectedFile = null;
  var isProcessing = false;
  var logLines = [];

  /* ---- key ---- */
  function getKey() { return sessionStorage.getItem("anthropic_api_key") || ""; }

  function setKeyStatus(ok) {
    var el = sel.keyStatus();
    el.textContent = ok ? "설정됨" : "미설정";
    el.className = ok ? "set" : "unset";
  }

  function updateStartBtn() {
    var ok = !!(selectedFile && getKey());
    sel.startBtn().disabled = !ok;
    sel.keyNotice().style.display = (selectedFile && !getKey()) ? "block" : "none";
  }

  // init key
  var saved = getKey();
  if (saved) { sel.keyInput().value = saved; setKeyStatus(true); }
  updateStartBtn();

  sel.keyInput().addEventListener("input", function () {
    var k = sel.keyInput().value.trim();
    if (k) { sessionStorage.setItem("anthropic_api_key", k); setKeyStatus(true); }
    else   { sessionStorage.removeItem("anthropic_api_key"); setKeyStatus(false); }
    updateStartBtn();
  });

  /* ---- file ---- */
  document.getElementById("file-input").addEventListener("change", function (e) {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  var dz = document.getElementById("drop-zone");
  dz.addEventListener("dragover", function (e) { e.preventDefault(); dz.classList.add("drag-over"); });
  dz.addEventListener("dragleave", function () { dz.classList.remove("drag-over"); });
  dz.addEventListener("drop", function (e) {
    e.preventDefault();
    dz.classList.remove("drag-over");
    var f = e.dataTransfer.files[0];
    if (f && f.type === "application/pdf") setFile(f);
    else showToast("PDF 파일만 지원합니다.", "error");
  });

  function setFile(file) {
    selectedFile = file;
    sel.fileName().textContent = file.name + " (" + (file.size / 1048576).toFixed(2) + " MB)";
    sel.selFile().style.display = "block";
    sel.pageTo().value = "";
    updateStartBtn();
  }

  /* ---- OCR ---- */
  document.getElementById("start-btn").addEventListener("click", startOCR);

  function startOCR() {
    if (!selectedFile || isProcessing || !getKey()) return;
    isProcessing = true;

    var scale    = parseFloat(document.getElementById("scale-select").value);
    var pageFrom = parseInt(document.getElementById("page-from").value, 10) || 1;
    var pageToV  = parseInt(sel.pageTo().value, 10) || 0;
    var btn = sel.startBtn();
    btn.disabled = true;
    btn.textContent = "처리 중...";

    sel.progSec().style.display = "block";
    sel.prevSec().style.display = "block";
    sel.canvasCon().innerHTML = "";
    sel.pageLog().innerHTML = "";
    logLines = [];
    sel.emptyState().style.display = "none";
    sel.outputText().style.display = "block";
    sel.charCount().style.display = "block";
    sel.outputText().value = "";

    setProgress(0, "PDF 파일 로딩 중...");

    selectedFile.arrayBuffer().then(function (buf) {
      return pdfjsLib.getDocument({ data: buf }).promise;
    }).then(function (pdf) {
      var total = pdf.numPages;
      var end   = pageToV > 0 ? Math.min(pageToV, total) : total;
      var start = Math.max(1, pageFrom);
      var count = end - start + 1;
      var allText = "";
      var pn = start;

      setProgress(3, "전체 " + total + "페이지 (시작: " + start + ", 끝: " + end + ")");

      function next() {
        if (pn > end) {
          setProgress(100, "완료! " + count + "페이지 처리됨");
          showToast("OCR 변환이 완료되었습니다!", "success");
          done();
          return;
        }
        var idx  = pn - start;
        var base = 5 + (idx / count) * 92;
        addLog("페이지 " + pn + " 렌더링 중...", "active");
        setProgress(base, "페이지 " + pn + " / " + end + " - 렌더링 중...");

        pdf.getPage(pn).then(function (page) {
          var vp = page.getViewport({ scale: scale });
          var cv = document.createElement("canvas");
          cv.width = vp.width; cv.height = vp.height;
          return page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise
            .then(function () { return cv; });
        }).then(function (cv) {
          var ts = Math.min(1, 280 / cv.width);
          var th = document.createElement("canvas");
          th.width = cv.width * ts; th.height = cv.height * ts;
          th.getContext("2d").drawImage(cv, 0, 0, th.width, th.height);
          sel.canvasCon().appendChild(th);

          var MAX_PX = 7000;
          var sendCanvas = cv;
          if (cv.width > MAX_PX || cv.height > MAX_PX) {
            var ratio = Math.min(MAX_PX / cv.width, MAX_PX / cv.height);
            var sc = document.createElement("canvas");
            sc.width  = Math.floor(cv.width  * ratio);
            sc.height = Math.floor(cv.height * ratio);
            sc.getContext("2d").drawImage(cv, 0, 0, sc.width, sc.height);
            sendCanvas = sc;
          }
          var du = sendCanvas.toDataURL("image/jpeg", 0.85);
          var b64 = du.slice(du.indexOf(",") + 1);

          setProgress(base + (0.45 / count) * 92, "페이지 " + pn + " - Claude AI 인식 중...");
          updateLastLog("페이지 " + pn + " Claude AI 인식 중...", "active");

          return callAPI(b64);
        }).then(function (text) {
          var fixed = text ? fixText(text.trim()) : "";
          allText += "\n\n===== [ " + pn + "페이지 ] =====\n\n"
            + (fixed || "(텍스트를 인식하지 못했습니다)");
          sel.outputText().value = allText.trim();
          sel.charCount().textContent = "글자 수: " + allText.trim().length.toLocaleString()
            + " | 줄 수: " + allText.trim().split("\n").length.toLocaleString();
          updateLastLog("페이지 " + pn + " 완료", "done");
          pn++;
          next();
        }).catch(onerr);
      }

      next();

      function done() {
        btn.disabled = false;
        btn.textContent = "OCR 변환 시작";
        isProcessing = false;
        updateStartBtn();
      }

      function onerr(err) {
        addLog("오류: " + err.message, "error");
        setProgress(0, "오류 발생");
        showToast("오류: " + err.message, "error");
        done();
      }
    }).catch(function (err) {
      addLog("오류: " + err.message, "error");
      setProgress(0, "오류 발생");
      showToast("오류: " + err.message, "error");
      sel.startBtn().disabled = false;
      sel.startBtn().textContent = "OCR 변환 시작";
      isProcessing = false;
      updateStartBtn();
    });
  }

  function callAPI(b64) {
    var key = getKey();
    if (!key) return Promise.reject(new Error("API 키가 없습니다."));
    var prompt = "이 이미지는 한국어 국어 시험지의 한 페이지입니다. "
      + "이미지에 있는 모든 텍스트를 정확하게 추출해주세요. "
      + "문항 번호, 지문, 보기, 선택지 등 모든 텍스트를 포함하고, "
      + "한국어, 영어, 한자를 모두 인식해주세요. "
      + "원본의 구조와 순서를 최대한 유지하되, "
      + "텍스트만 출력하고 다른 설명은 하지 마세요.";
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-4-8",
        max_tokens: 4096,
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
          { type: "text", text: prompt }
        ]}]
      })
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (e) {
        throw new Error((e.error && e.error.message) || ("API 오류: " + r.status));
      });
      return r.json();
    }).then(function (d) { return d.content[0].text; });
  }

  function fixText(t) {
    var odq = String.fromCharCode(0x201C);
    var cdq = String.fromCharCode(0x201D);
    var osq = String.fromCharCode(0x2018);
    var csq = String.fromCharCode(0x2019);
    t = t.replace(/"([^"]*)"/g, odq + "$1" + cdq);
    t = t.replace(/'([^']*)'/g, osq + "$1" + csq);
    t = t.replace(/[\[(][\d.]+\s*점[\])]/g, "");
    return t;
  }

  /* ---- utils ---- */
  function setProgress(p, txt) {
    sel.progBar().style.width = p + "%";
    sel.progText().textContent = txt;
  }

  function addLog(msg, cls) { logLines.push({ msg: msg, cls: cls }); renderLog(); }

  function updateLastLog(msg, cls) {
    if (logLines.length) logLines[logLines.length - 1] = { msg: msg, cls: cls };
    else logLines.push({ msg: msg, cls: cls });
    renderLog();
  }

  function renderLog() {
    sel.pageLog().innerHTML = logLines.map(function (l) {
      return "<div class=\"log-line " + l.cls + "\">" + l.msg + "</div>";
    }).join("");
    sel.pageLog().scrollTop = sel.pageLog().scrollHeight;
  }

  function showToast(msg, type) {
    var t = sel.toast();
    t.textContent = msg;
    t.className = "toast show" + (type ? " " + type : "");
    setTimeout(function () { t.className = "toast"; }, 3500);
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  return {
    toggleKey: function () {
      var inp = sel.keyInput();
      inp.type = inp.type === "password" ? "text" : "password";
    },
    copy: function () {
      var t = sel.outputText().value;
      if (!t) { showToast("복사할 텍스트가 없습니다.", "error"); return; }
      navigator.clipboard.writeText(t).then(function () { showToast("클립보드에 복사되었습니다!", "success"); });
    },
    download: function () {
      var text = sel.outputText().value;
      if (!text) { showToast("저장할 텍스트가 없습니다.", "error"); return; }
      var base = selectedFile ? selectedFile.name.replace(/\.pdf$/i, "") : "ocr_result";
      var secs = text.split(/\n*={5}\s*\[\s*(\d+)페이지\s*\]\s*={5}\n*/);
      var body = "";
      for (var i = 1; i < secs.length; i += 2) {
        var pg = secs[i];
        var lines = (secs[i+1]||"").trim().split("\n").map(function(l){return "<p>"+escHtml(l||" ")+"</p>";}).join("\n");
        body += "<section><h2>" + pg + "페이지</h2><div class=\"pb\">\n" + lines + "\n</div></section>\n";
      }
      var html = "<!DOCTYPE html><html lang=\"ko\"><head><meta charset=\"UTF-8\"><title>" + escHtml(base) + " - OCR</title>"
        + "<style>body{font-family:'Malgun Gothic',sans-serif;max-width:860px;margin:40px auto;padding:0 20px;color:#222}"
        + "h1{font-size:20px;border-bottom:2px solid #2c3e50;padding-bottom:10px;margin-bottom:30px}"
        + "section{margin-bottom:40px}h2{font-size:15px;color:#2c3e50;background:#eaf4fd;padding:6px 14px;border-left:4px solid #3498db;margin-bottom:12px}"
        + ".pb{line-height:2;font-size:14px}p{margin:0}</style></head><body>"
        + "<h1>" + escHtml(base) + " OCR 결과</h1>" + body + "</body></html>";
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = base + "_ocr.html";
      a.click();
      showToast("HTML 파일로 저장되었습니다.", "success");
    },
    clear: function () {
      sel.outputText().value = "";
      sel.outputText().style.display = "none";
      sel.charCount().style.display = "none";
      sel.emptyState().style.display = "block";
      sel.progSec().style.display = "none";
      sel.prevSec().style.display = "none";
      sel.pageLog().innerHTML = "";
      logLines = [];
    }
  };
}());
</script>
</body>
</html>
