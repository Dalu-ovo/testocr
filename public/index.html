<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국어 시험지 OCR 변환기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 20px; font-weight: 600; }
    header span { font-size: 26px; }
    header .model-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      color: #a8d8ea;
    }

    /* API 키 바 */
    .api-key-bar {
      background: #1a252f;
      padding: 10px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .api-key-label {
      font-size: 13px;
      color: #ccc;
      white-space: nowrap;
    }

    .api-key-input-wrap {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 220px;
      max-width: 500px;
      background: #2c3e50;
      border: 1px solid #3d5166;
      border-radius: 6px;
      overflow: hidden;
    }

    .api-key-input-wrap:focus-within {
      border-color: #3498db;
    }

    #api-key-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 7px 12px;
      font-size: 13px;
      color: #eee;
      font-family: monospace;
    }

    #api-key-input::placeholder { color: #6a7e90; }

    .api-key-toggle {
      background: transparent;
      border: none;
      padding: 7px 10px;
      cursor: pointer;
      color: #888;
      font-size: 14px;
      line-height: 1;
    }

    .api-key-toggle:hover { color: #ccc; }

    #api-key-status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    #api-key-status.set { background: #1e6b3c; color: #6fcf97; }
    #api-key-status.unset { background: #5c2c2c; color: #eb5757; }

    .api-key-link {
      font-size: 12px;
      color: #5dade2;
      text-decoration: none;
      white-space: nowrap;
    }

    .api-key-link:hover { text-decoration: underline; }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .api-key-bar { padding: 10px 20px; }
      header { padding: 14px 20px; }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #555;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f2f5;
    }

    /* 업로드 영역 */
    #drop-zone {
      border: 2px dashed #c0c8d0;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafbfc;
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #3498db;
      background: #ebf5fb;
    }

    #drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
    #drop-zone p { color: #666; font-size: 14px; margin-bottom: 8px; }
    #drop-zone strong { color: #3498db; }

    #file-input { display: none; }

    #selected-file {
      margin-top: 12px;
      padding: 10px 14px;
      background: #eaf4fd;
      border-radius: 8px;
      font-size: 13px;
      color: #2980b9;
      display: none;
    }

    /* 옵션 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .option-row label { color: #555; min-width: 80px; }

    select, input[type="number"] {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      color: #333;
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #3498db;
    }

    input[type="number"] { width: 70px; }

    /* 버튼 */
    #start-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #start-btn:hover:not(:disabled) { background: #27ae60; }
    #start-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

    #api-key-notice {
      margin-top: 10px;
      font-size: 12px;
      color: #e67e22;
      text-align: center;
      display: none;
    }

    /* 진행 상태 */
    #progress-section { display: none; margin-top: 20px; }

    .progress-bar-wrap {
      background: #ecf0f1;
      border-radius: 100px;
      height: 10px;
      overflow: hidden;
      margin: 10px 0;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3498db, #2ecc71);
      border-radius: 100px;
      width: 0%;
      transition: width 0.3s;
    }

    #progress-text { font-size: 13px; color: #666; text-align: center; }

    #page-log {
      max-height: 140px;
      overflow-y: auto;
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      line-height: 1.8;
    }

    .log-line { padding: 1px 0; }
    .log-line.done { color: #27ae60; }
    .log-line.active { color: #3498db; font-weight: bold; }
    .log-line.error { color: #e74c3c; }

    /* 결과 영역 */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f2f5;
    }

    .result-header h2 { font-size: 16px; font-weight: 600; color: #555; border: none; padding: 0; margin: 0; }

    .btn-group { display: flex; gap: 8px; }

    .btn-sm {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy { background: #3498db; color: white; }
    .btn-copy:hover { background: #2980b9; }
    .btn-download { background: #9b59b6; color: white; }
    .btn-download:hover { background: #8e44ad; }
    .btn-clear { background: #e74c3c; color: white; }
    .btn-clear:hover { background: #c0392b; }

    #output-text {
      width: 100%;
      height: 500px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.8;
      resize: vertical;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', monospace;
      color: #333;
      background: #fafbfc;
    }

    #output-text:focus { outline: none; border-color: #3498db; }

    #char-count {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
      text-align: right;
    }

    /* 미리보기 */
    #preview-section { margin-top: 20px; }

    #preview-section h3 {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    #canvas-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    #canvas-container canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
      max-width: 100%;
    }

    /* 알림 */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #2c3e50;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 1000;
      max-width: 320px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #27ae60; }
    .toast.error { background: #e74c3c; }

    /* 빈 상태 */
    #empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #bbb;
    }

    #empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    #empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<header>
  <span>📝</span>
  <h1>국어 시험지 OCR 변환기</h1>
  <span class="model-badge">claude-opus-4-8</span>
</header>

<!-- API 키 입력 바 -->
<div class="api-key-bar">
  <span class="api-key-label">🔑 API Key</span>
  <div class="api-key-input-wrap">
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
    <button class="api-key-toggle" onclick="toggleKeyVisibility()" title="보기/숨기기">👁</button>
  </div>
  <span id="api-key-status" class="unset">미설정</span>
  <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener" class="api-key-link">키 발급 →</a>
</div>

<div class="container">
  <!-- 왼쪽: 업로드 및 설정 -->
  <div class="card">
    <h2>PDF 파일 업로드</h2>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">📄</div>
      <p><strong>클릭하여 파일 선택</strong> 또는 여기에 파일을 끌어다 놓으세요</p>
      <p>지원 형식: PDF</p>
    </div>

    <input type="file" id="file-input" accept=".pdf">
    <div id="selected-file">📎 <span id="file-name"></span></div>

    <div class="options">
      <div class="option-row">
        <label>렌더링 배율</label>
        <select id="scale-select">
          <option value="2">2x (권장)</option>
          <option value="1.5">1.5x (빠름)</option>
          <option value="3">3x (고화질, 느림)</option>
        </select>
      </div>
      <div class="option-row">
        <label>페이지 범위</label>
        <input type="number" id="page-from" min="1" value="1" placeholder="시작">
        <span style="color:#aaa">~</span>
        <input type="number" id="page-to" min="1" value="" placeholder="끝 (전체)">
      </div>
    </div>

    <button id="start-btn" disabled>OCR 변환 시작</button>
    <div id="api-key-notice">상단에서 Anthropic API Key를 먼저 입력하세요.</div>

    <div id="progress-section">
      <div class="progress-bar-wrap">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-text">준비 중...</div>
      <div id="page-log"></div>
    </div>

    <div id="preview-section" style="display:none">
      <h3>페이지 미리보기</h3>
      <div id="canvas-container"></div>
    </div>
  </div>

  <!-- 오른쪽: 결과 텍스트 -->
  <div class="card">
    <div class="result-header">
      <h2>인식된 텍스트</h2>
      <div class="btn-group">
        <button class="btn-sm btn-copy" onclick="copyText()">복사</button>
        <button class="btn-sm btn-download" onclick="downloadText()">HTML 저장</button>
        <button class="btn-sm btn-clear" onclick="clearText()">지우기</button>
      </div>
    </div>

    <div id="empty-state">
      <div class="icon">🔍</div>
      <p>PDF를 업로드하고 OCR 변환을 시작하면<br>인식된 텍스트가 여기에 표시됩니다.</p>
    </div>

    <textarea id="output-text" style="display:none" placeholder="인식된 텍스트가 여기에 표시됩니다..."></textarea>
    <div id="char-count" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let selectedFile = null;
  let isProcessing = false;

  // API 키 초기화 (sessionStorage에서 복원)
  (function initApiKey() {
    const saved = sessionStorage.getItem('anthropic_api_key');
    if (saved) {
      document.getElementById('api-key-input').value = saved;
      setKeyStatus(true);
    }
    updateStartBtnState();
  })();

  document.getElementById('api-key-input').addEventListener('input', function () {
    const key = this.value.trim();
    if (key) {
      sessionStorage.setItem('anthropic_api_key', key);
      setKeyStatus(true);
    } else {
      sessionStorage.removeItem('anthropic_api_key');
      setKeyStatus(false);
    }
    updateStartBtnState();
  });

  function setKeyStatus(isSet) {
    const el = document.getElementById('api-key-status');
    if (isSet) {
      el.textContent = '설정됨';
      el.className = 'set';
    } else {
      el.textContent = '미설정';
      el.className = 'unset';
    }
  }

  function toggleKeyVisibility() {
    const input = document.getElementById('api-key-input');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function updateStartBtnState() {
    const hasFile = !!selectedFile;
    const hasKey = !!(sessionStorage.getItem('anthropic_api_key'));
    document.getElementById('start-btn').disabled = !(hasFile && hasKey);
    document.getElementById('api-key-notice').style.display =
      (hasFile && !hasKey) ? 'block' : 'none';
  }

  // 파일 선택
  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) setFile(file);
  });

  // 드래그 앤 드롭
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') setFile(file);
    else showToast('PDF 파일만 지원합니다.', 'error');
  });

  function setFile(file) {
    selectedFile = file;
    document.getElementById('file-name').textContent =
      `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
    document.getElementById('selected-file').style.display = 'block';
    document.getElementById('page-to').value = '';
    updateStartBtnState();
  }

  // Claude API 호출
  async function callClaudeOCR(imageBase64) {
    const apiKey = sessionStorage.getItem('anthropic_api_key');
    if (!apiKey) throw new Error('API 키가 설정되지 않았습니다.');

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: 4096,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: {
                type: 'base64',
                media_type: 'image/jpeg',
                data: imageBase64
              }
            },
            {
              type: 'text',
              text: '이 이미지는 한국어 국어 시험지의 한 페이지입니다. 이미지에 있는 모든 텍스트를 정확하게 추출해주세요. 문항 번호, 지문, 보기, 선택지 등 모든 텍스트를 포함하고, 한국어, 영어, 한자를 모두 인식해주세요. 원본의 구조와 순서를 최대한 유지하되, 텍스트만 출력하고 다른 설명은 하지 마세요. 따옴표는 반드시 열고 닫는 형태의 typographic quote를 사용하세요: 작은따옴표는 ‘ ’(‘ ’), 큰따옴표는 “ ”(“ ”).'
            }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `API 오류: ${response.status}`);
    }

    const data = await response.json();
    return data.content[0].text;
  }

  // OCR 시작
  document.getElementById('start-btn').addEventListener('click', startOCR);

  async function startOCR() {
    if (!selectedFile || isProcessing) return;

    const apiKey = sessionStorage.getItem('anthropic_api_key');
    if (!apiKey) {
      showToast('API 키를 먼저 입력하세요.', 'error');
      return;
    }

    isProcessing = true;
    const scale = parseFloat(document.getElementById('scale-select').value);
    const pageFrom = parseInt(document.getElementById('page-from').value) || 1;
    const pageToVal = parseInt(document.getElementById('page-to').value) || 0;

    const btn = document.getElementById('start-btn');
    btn.disabled = true;
    btn.textContent = '처리 중...';

    document.getElementById('progress-section').style.display = 'block';
    document.getElementById('preview-section').style.display = 'block';
    document.getElementById('canvas-container').innerHTML = '';
    document.getElementById('page-log').innerHTML = '';
    logLines = [];

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('output-text').style.display = 'block';
    document.getElementById('char-count').style.display = 'block';
    document.getElementById('output-text').value = '';

    try {
      setProgress(0, 'PDF 파일 로딩 중...');
      const arrayBuffer = await selectedFile.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      const totalPages = pdf.numPages;
      const endPage = pageToVal > 0 ? Math.min(pageToVal, totalPages) : totalPages;
      const startPage = Math.max(1, pageFrom);
      const pageCount = endPage - startPage + 1;

      setProgress(3, `총 ${totalPages}페이지 발견 (${startPage}~${endPage}페이지 처리 예정)`);

      let allText = '';

      for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
        const pageIdx = pageNum - startPage;
        const baseRatio = 5 + (pageIdx / pageCount) * 92;

        addLog(`페이지 ${pageNum} 렌더링 중...`, 'active');
        setProgress(baseRatio, `페이지 ${pageNum} / ${endPage} — 렌더링 중...`);

        // PDF 페이지 → Canvas
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        // 미리보기 썸네일 추가
        const thumb = document.createElement('canvas');
        const tScale = Math.min(1, 280 / viewport.width);
        thumb.width = viewport.width * tScale;
        thumb.height = viewport.height * tScale;
        thumb.getContext('2d').drawImage(canvas, 0, 0, thumb.width, thumb.height);
        document.getElementById('canvas-container').appendChild(thumb);

        // Canvas → JPEG base64 (압축하여 API 크기 절약)
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);

        setProgress(baseRatio + (0.45 / pageCount) * 92, `페이지 ${pageNum} / ${endPage} — Claude AI 인식 중...`);
        updateLastLog(`페이지 ${pageNum} Claude AI 인식 중...`, 'active');

        const pageText = await callClaudeOCR(base64);
        const fixedText = pageText ? fixQuotes(pageText.trim()) : null;

        allText += `\n\n===== [ ${pageNum}페이지 ] =====\n\n${fixedText || '(텍스트를 인식하지 못했습니다)'}`;
        document.getElementById('output-text').value = allText.trim();
        updateCharCount(allText.trim());
        updateLastLog(`페이지 ${pageNum} 완료 ✓`, 'done');
      }

      setProgress(100, `완료! 총 ${pageCount}페이지 처리됨`);
      showToast('OCR 변환이 완료되었습니다!', 'success');

    } catch (err) {
      console.error(err);
      addLog('오류: ' + err.message, 'error');
      setProgress(0, '오류 발생');
      showToast('오류: ' + err.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = 'OCR 변환 시작';
    isProcessing = false;
    updateStartBtnState();
  }

  // ── 유틸리티 ──

  function setProgress(pct, text) {
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = text;
  }

  let logLines = [];

  function addLog(msg, cls) {
    logLines.push({ msg, cls });
    renderLog();
  }

  function updateLastLog(msg, cls) {
    if (logLines.length > 0) {
      logLines[logLines.length - 1] = { msg, cls };
    } else {
      logLines.push({ msg, cls });
    }
    renderLog();
  }

  function renderLog() {
    const el = document.getElementById('page-log');
    el.innerHTML = logLines.map(l =>
      `<div class="log-line ${l.cls}">• ${l.msg}</div>`
    ).join('');
    el.scrollTop = el.scrollHeight;
  }

  function updateCharCount(text) {
    const chars = text.length;
    const lines = text.split('\n').length;
    document.getElementById('char-count').textContent =
      `글자 수: ${chars.toLocaleString()} | 줄 수: ${lines.toLocaleString()}`;
  }

  function copyText() {
    const text = document.getElementById('output-text').value;
    if (!text) { showToast('복사할 텍스트가 없습니다.', 'error'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('클립보드에 복사되었습니다!', 'success'));
  }

  function downloadText() {
    const text = document.getElementById('output-text').value;
    if (!text) { showToast('저장할 텍스트가 없습니다.', 'error'); return; }

    const baseName = selectedFile ? selectedFile.name.replace(/\.pdf$/i, '') : 'ocr_result';
    const fileName = baseName + '_ocr.html';

    const sections = text.split(/\n*={5}\s*\[\s*(\d+)페이지\s*\]\s*={5}\n*/);
    let bodyHtml = '';
    for (let i = 1; i < sections.length; i += 2) {
      const pageNum = sections[i];
      const pageText = (sections[i + 1] || '').trim();
      const lines = pageText.split('\n').map(l => `<p>${escapeHtml(l) || '&nbsp;'}</p>`).join('\n');
      bodyHtml += `<section>\n  <h2>${pageNum}페이지</h2>\n  <div class="page-body">\n${lines}\n  </div>\n</section>\n`;
    }

    const html = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>${escapeHtml(baseName)} - OCR 결과</title>
  <style>
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #222; background: #fff; }
    h1 { font-size: 20px; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 30px; }
    section { margin-bottom: 40px; page-break-inside: avoid; }
    h2 { font-size: 15px; color: #2c3e50; background: #eaf4fd; padding: 6px 14px; border-left: 4px solid #3498db; margin-bottom: 12px; }
    .page-body { line-height: 2; font-size: 14px; }
    p { margin: 0; }
    @media print { body { margin: 20px; } }
  </style>
</head>
<body>
  <h1>${escapeHtml(baseName)} OCR 결과</h1>
${bodyHtml}</body>
</html>`;

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    showToast('HTML 파일로 저장되었습니다.', 'success');
  }

  function fixQuotes(text) {
    // 직선 큰따옴표 → 열고 닫는 큰따옴표
    text = text.replace(/”([^”]*)”/g, ‘”$1”’);
    // 직선 작은따옴표(쌍으로 된 것) → 열고 닫는 작은따옴표
    text = text.replace(/’([^’]*)’/g, ‘’$1’’);
    // 배점 표기 제거: [3점], [3.3점], (2점) 등
    text = text.replace(/[\[(][\d.]+\s*점[\])]/g, ‘’);
    return text;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function clearText() {
    document.getElementById('output-text').value = '';
    document.getElementById('output-text').style.display = 'none';
    document.getElementById('char-count').style.display = 'none';
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('progress-section').style.display = 'none';
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('page-log').innerHTML = '';
    logLines = [];
  }

  function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(() => { toast.className = 'toast'; }, 3500);
  }
</script>
</body>
</html>
